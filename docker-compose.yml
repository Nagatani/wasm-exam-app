services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: wasm_exam
      POSTGRES_USER: wasm_exam
      POSTGRES_PASSWORD: wasm_exam
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Sandboxed compile/run service (Java + C, see judge/Judge.java). Compilation
  # and student code execution happen only inside this container — never on
  # the host — so it behaves the same on macOS and Linux. The container
  # itself is the sandbox: no Linux capabilities, read-only root fs, tmpfs
  # scratch, capped process count / memory / CPU. Reached only by the app
  # server over loopback (JUDGE_URL), never exposed publicly.
  #
  # NOTE: this dev/two-terminal setup does NOT block judge's own outbound
  # network access (cap_drop/read_only/tmpfs don't stop connect()) — a
  # published loopback port is required here so a host-run `server` can reach
  # it. For a deployment where that matters, use docker-compose.prod.yml
  # instead: it containerizes `server` too and puts it on the same
  # Docker-internal network as `judge`, so judge needs no published port at
  # all and can be given `internal: true` (verified: this — not the network
  # flag alone — is what actually blocks egress without depending on the
  # Docker flavor). See docs/operations.md "コンテナ化した運用構成".
  judge:
    build: ./judge
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    # Grading throughput scales with CPUs (docs/operations.md "採点の処理能力"):
    # set JUDGE_CPUS and JUDGE_MAX_CONCURRENT together (≈ one run per CPU)
    # and the server's JUDGE_CONCURRENCY to the same value.
    mem_limit: ${JUDGE_MEM_LIMIT:-1g}
    cpus: ${JUDGE_CPUS:-2.0}
    tmpfs:
      # Both noexec (Docker's tmpfs default): nothing is ever exec()ed from
      # here — Java runs .class data with the rootfs `java`, and C is compiled
      # to wasm and run by the rootfs `node` (judge/Judge.java). (Until
      # 2026-09-26 /work needed `exec` for gcc-built native binaries.)
      - /work:size=192m,mode=1777
      - /tmp:size=64m,mode=1777
    environment:
      JUDGE_MAX_CONCURRENT: ${JUDGE_MAX_CONCURRENT:-2}
    ports:
      # Loopback only. In the two-terminal dev workflow the app server runs on
      # the host and reaches the judge here; set JUDGE_URL=http://localhost:4001.
      - '127.0.0.1:4001:8080'

volumes:
  pgdata:
